[package]
name = "axum-security-oidc"
version = "0.0.1"
edition = "2024"
authors = ["Joey de Waal <dewaaljoey@gmail.com>"]
license = "MIT"
description = "A minimal OpenID Connect client library, part of the axum-security workspace"
repository = "https://github.com/joeydewaal/axum-security/"
documentation = "https://docs.rs/axum-security-oidc"
keywords = ["security", "oidc", "openid", "http"]
categories = ["web-programming", "authentication", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["reqwest", "rustls"]
# HTTP backends — forwarded to axum-security-oauth2's shared HttpClient enum.
reqwest = ["axum-security-oauth2/reqwest"]
rustls = ["axum-security-oauth2/rustls"]
native-tls = ["axum-security-oauth2/native-tls"]
# Typed timestamp accessors on OidcClaims / UtcTimestamp.
jiff = ["dep:jiff"]
chrono = ["dep:chrono"]
time = ["dep:time"]

[dependencies]
axum-security-oauth2 = { path = "../axum-security-oauth2", version = "0.0.1", default-features = false }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
subtle.workspace = true
url.workspace = true
# Async mutex for the JWKS cache — held across the fetch so callers coalesce.
# The "sync" feature is just the primitives, no runtime (reqwest pulls tokio anyway).
tokio = { workspace = true, features = ["sync"] }

jiff = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[dev-dependencies]
# `use_pem` lets the tests sign fixtures with an RSA private key (PEM).
jsonwebtoken = { workspace = true, features = ["aws_lc_rs", "use_pem"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
