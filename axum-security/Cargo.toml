[package]
name = "axum-security"
version = "0.0.2"
edition = "2024"
authors = ["Joey de Waal <dewaaljoey@gmail.com>"]
license = "MIT"
readme = "../README.md"
description = "A security toolbox for the Axum library"
repository = "https://github.com/joeydewaal/axum-security/"
documentation = "https://docs.rs/axum-security"
keywords = ["security", "axum", "http", "cookie", "jwt"]
categories = ["web-programming", "security", "asynchronous"]


[package.metadata.docs.rs]
features = ["cookie", "jwt", "oauth2", "oidc", "rbac", "macros", "pbac", "headers", "jiff", "chrono", "time"]

[features]
tracing = ["dep:tracing"]
cookie = ["dep:cookie-monster", "dep:uuid"]
jwt = ["dep:jsonwebtoken"]
oauth2 = ["dep:axum-security-oauth2", "axum-security-oauth2/reqwest", "axum-security-oauth2/rustls", "dep:url", "dep:wincode", "dep:base64", "dep:hmac", "dep:sha2", "dep:rand", "dep:subtle", "cookie"]
oidc = ["dep:axum-security-oidc", "axum-security-oidc/reqwest", "axum-security-oidc/rustls", "dep:url", "dep:wincode", "dep:base64", "dep:hmac", "dep:sha2", "dep:rand", "dep:subtle", "cookie"]
basic-auth = ["dep:base64"]
rbac = []
macros = ["dep:axum-security-macros"]
pbac = []
headers = ["dep:pin-project-lite"]

jiff = ["dep:jiff", "cookie-monster?/jiff", "axum-security-oidc?/jiff"]
chrono = ["dep:chrono", "cookie-monster?/chrono", "axum-security-oidc?/chrono"]
time = ["dep:time", "cookie-monster?/time", "axum-security-oidc?/time"]


[dependencies]
axum = { workspace = true, features = ["query"] }
http.workspace = true
tokio = { workspace = true, features = ["sync"] }
tower.workspace = true

tracing = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }

cookie-monster = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"], optional = true }
axum-security-macros = { path = "../axum-security-macros", version = "0.0.2", optional = true }
axum-security-oauth2 = { path = "../axum-security-oauth2", version = "0.0.2", default-features = false, optional = true }
axum-security-oidc = { path = "../axum-security-oidc", version = "0.0.2", default-features = false, optional = true }
url = { workspace = true, optional = true }

uuid = { workspace = true, features = ["v7"], optional = true }
serde.workspace = true
wincode = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
time = { workspace = true, optional = true }
