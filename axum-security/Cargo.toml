[package]
name = "axum-security"
version = "0.0.1"
edition = "2024"
authors = ["Joey de Waal <dewaaljoey@gmail.com>"]
license = "MIT"
readme = "../README.md"
description = "A security toolbox for the Axum library"
repository = "https://github.com/joeydewaal/axum-security/"
documentation = "https://docs.rs/axum-security"
keywords = ["security", "axum", "http", "cookie", "jwt"]
categories = ["web-programming", "security", "asynchronous"]


[package.metadata.docs.rs]
features = ["cookie", "jwt", "oauth2", "oidc", "rbac", "pbac", "headers", "jiff", "chrono", "time"]

[features]
tracing = ["dep:tracing"]
cookie = ["dep:cookie-monster", "dep:uuid"]
jwt = ["dep:jsonwebtoken"]
oauth2 = ["dep:oauth2", "dep:wincode", "dep:base64", "dep:hmac", "dep:sha2", "dep:rand", "dep:subtle", "cookie"]
oidc = ["dep:openidconnect", "dep:wincode", "dep:base64", "dep:hmac", "dep:sha2", "dep:rand", "dep:subtle", "dep:serde_json", "cookie"]
basic-auth = ["dep:base64"]
rbac = []
rbac-macros = ["rbac", "dep:axum-security-macros"]
pbac = []
headers = ["dep:pin-project-lite"]

jiff = ["dep:jiff", "cookie-monster?/jiff"]
chrono = ["dep:chrono", "cookie-monster?/chrono"]
time = ["dep:time", "cookie-monster?/time"]


[dependencies]
axum = { workspace = true, features = ["query"] }
http.workspace = true
tokio.workspace = true
tower.workspace = true

tracing = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }

cookie-monster = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"], optional = true }
oauth2 = { workspace = true, features = ["reqwest", "rustls-tls"], optional = true }
openidconnect = { workspace = true, optional = true }

axum-security-macros = { path = "../axum-security-macros", version = "0.0.1", optional = true }

uuid = { workspace = true, features = ["v7"], optional = true }
serde.workspace = true
wincode = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
time = { workspace = true, optional = true }
